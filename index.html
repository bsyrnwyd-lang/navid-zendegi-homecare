            navigator.serviceWorker.getRegistrations().then(function(regs){
              regs.forEach(function(sw){ try { sw.unregister(); } catch(_){} });
              if (had && !sessionStorage.getItem('__navid_sw_cleared__')) {
                sessionStorage.setItem('__navid_sw_cleared__','1');
                var v='v='+Date.now();
                var url=location.href.indexOf('?')>-1? location.href+'&'+v : location.href+'?'+v;
                location.replace(url);
              }
            }).catch(function(){});
          }
        } catch(_){}
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
